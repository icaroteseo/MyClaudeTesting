[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "spell-compendium"
version = "0.1.0"
description = "D&D 5e spell compendium powered by the 5e API"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
spell-compendium = "spell_compendium.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spell_compendium*"]
