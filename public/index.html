<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D&D 5e Spell Compendium</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0e17;
      --surface:   #1a1825;
      --surface2:  #242233;
      --border:    #302d4a;
      --accent:    #c9a84c;
      --accent2:   #e8c46a;
      --text:      #e8e6f0;
      --muted:     #7c7a8e;
      --red:       #e05c5c;
      --blue:      #5c9ee0;
      --green:     #5cb87c;
      --purple:    #a07ee0;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent2);
      letter-spacing: .04em;
      white-space: nowrap;
    }
    header h1 span { color: var(--muted); font-weight: 400; font-size: 1rem; }
    #spell-count {
      margin-left: auto;
      font-size: .85rem;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Layout ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 57px);
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 340px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }

    .filters {
      padding: .75rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      border-bottom: 1px solid var(--border);
    }

    .filters input, .filters select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: .45rem .65rem;
      font-size: .85rem;
      width: 100%;
      outline: none;
      transition: border-color .15s;
    }
    .filters input:focus, .filters select:focus { border-color: var(--accent); }
    .filters select option { background: var(--surface2); }

    .filter-row { display: flex; gap: .5rem; }
    .filter-row select { flex: 1; }

    .filter-chips {
      display: flex;
      gap: .4rem;
      flex-wrap: wrap;
    }
    .chip {
      padding: .25rem .6rem;
      border-radius: 999px;
      font-size: .75rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all .15s;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.active { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }

    /* ── Spell list ── */
    #spell-list {
      flex: 1;
      overflow-y: auto;
      padding: .4rem 0;
    }
    #spell-list::-webkit-scrollbar { width: 6px; }
    #spell-list::-webkit-scrollbar-track { background: transparent; }
    #spell-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .spell-item {
      padding: .6rem .85rem;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background .1s, border-color .1s;
    }
    .spell-item:hover { background: var(--surface2); }
    .spell-item.active {
      background: var(--surface2);
      border-left-color: var(--accent);
    }
    .spell-item .spell-name {
      font-size: .9rem;
      font-weight: 500;
      color: var(--text);
    }
    .spell-item .spell-meta {
      font-size: .75rem;
      color: var(--muted);
      margin-top: .15rem;
      display: flex;
      gap: .5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: .1rem .4rem;
      border-radius: 4px;
      font-size: .68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .badge-level { background: #2a2040; color: var(--accent); }
    .badge-school { background: #1e2a3a; color: var(--blue); }
    .badge-conc  { background: #2a1e1e; color: var(--red); }
    .badge-ritual{ background: #1e2a20; color: var(--green); }

    /* ── Detail panel ── */
    .detail {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      background: var(--bg);
    }
    .detail::-webkit-scrollbar { width: 6px; }
    .detail::-webkit-scrollbar-track { background: transparent; }
    .detail::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .detail-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      gap: .75rem;
    }
    .detail-empty svg { opacity: .25; }

    .detail-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .detail-header h2 {
      font-size: 1.8rem;
      color: var(--accent2);
      margin-bottom: .5rem;
    }
    .detail-header .badges { display: flex; gap: .4rem; flex-wrap: wrap; }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: .75rem;
      margin-bottom: 1.5rem;
    }
    .detail-stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .6rem .85rem;
    }
    .detail-stat .label {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: .2rem;
    }
    .detail-stat .value {
      font-size: .9rem;
      color: var(--text);
      font-weight: 500;
    }

    .detail-section h3 {
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      margin-bottom: .6rem;
    }
    .detail-section p {
      font-size: .9rem;
      line-height: 1.65;
      color: var(--text);
      margin-bottom: .6rem;
    }
    .detail-section + .detail-section { margin-top: 1.25rem; }

    .classes-list {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
    }
    .class-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: .25rem .6rem;
      font-size: .8rem;
      color: var(--purple);
    }

    /* ── Loading / Error ── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 1rem;
      color: var(--muted);
      font-size: .9rem;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: #2a1a1a;
      border: 1px solid #5a2020;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      color: var(--red);
      font-size: .85rem;
      margin: 1rem;
    }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .layout { flex-direction: column; height: auto; }
      .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
      #spell-list { max-height: 45vh; }
      .detail { padding: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>⚔️ Spell Compendium <span>D&D 5e</span></h1>
  <span id="spell-count">Loading…</span>
</header>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="filters">
      <input type="search" id="search" placeholder="Search spells…" />

      <div class="filter-row">
        <select id="filter-level">
          <option value="">All levels</option>
          <option value="0">Cantrip</option>
          <option value="1">1st level</option>
          <option value="2">2nd level</option>
          <option value="3">3rd level</option>
          <option value="4">4th level</option>
          <option value="5">5th level</option>
          <option value="6">6th level</option>
          <option value="7">7th level</option>
          <option value="8">8th level</option>
          <option value="9">9th level</option>
        </select>
        <select id="filter-school">
          <option value="">All schools</option>
          <option>Abjuration</option>
          <option>Conjuration</option>
          <option>Divination</option>
          <option>Enchantment</option>
          <option>Evocation</option>
          <option>Illusion</option>
          <option>Necromancy</option>
          <option>Transmutation</option>
        </select>
      </div>

      <select id="filter-class">
        <option value="">All classes</option>
        <option>Bard</option>
        <option>Cleric</option>
        <option>Druid</option>
        <option>Paladin</option>
        <option>Ranger</option>
        <option>Sorcerer</option>
        <option>Warlock</option>
        <option>Wizard</option>
      </select>

      <div class="filter-chips">
        <button class="chip" data-filter="concentration">Concentration</button>
        <button class="chip" data-filter="ritual">Ritual</button>
      </div>
    </div>

    <div id="spell-list">
      <div class="loading"><div class="spinner"></div>Fetching spells…</div>
    </div>
  </aside>

  <!-- Detail panel -->
  <main class="detail" id="detail">
    <div class="detail-empty">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <p>Select a spell to view its details</p>
    </div>
  </main>

</div>

<script>
  const API = 'https://www.dnd5eapi.co';
  const SCHOOL_COLORS = {
    Abjuration: '#5c9ee0', Conjuration: '#e09e5c', Divination: '#5cb87c',
    Enchantment: '#e05c9e', Evocation: '#e05c5c', Illusion: '#a07ee0',
    Necromancy: '#7ee0c9', Transmutation: '#c9e07e',
  };

  let allSpells = [];
  let activeFilters = { level: '', school: '', cls: '', concentration: false, ritual: false };
  let activeIndex = null;
  let spellCache = {};

  // ── Fetch full list + detail for each spell ──────────────────────────────

  async function loadSpells() {
    try {
      const res = await fetch(`${API}/api/spells`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      allSpells = data.results; // [{index, name, url}]
      renderList();
    } catch (e) {
      document.getElementById('spell-list').innerHTML =
        `<div class="error-box">Failed to load spell list: ${e.message}</div>`;
      document.getElementById('spell-count').textContent = 'Error';
    }
  }

  async function fetchSpell(index) {
    if (spellCache[index]) return spellCache[index];
    const res = await fetch(`${API}/api/spells/${index}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    spellCache[index] = data;
    return data;
  }

  // ── Filtering ─────────────────────────────────────────────────────────────

  function getFilteredStubs() {
    const q = document.getElementById('search').value.toLowerCase();
    return allSpells.filter(s => {
      if (q && !s.name.toLowerCase().includes(q)) return false;
      return true; // level/school/class/conc/ritual filtered after detail fetch
    });
  }

  // For the sidebar list we only have name+index from the stub endpoint.
  // Full filtering (school, class, conc, ritual) happens after fetching detail.
  // We show stub list immediately; once a spell is clicked we show full details.
  // For filter sidebar we do a batch approach: pre-fetch a page or filter lazily.
  // Practical approach: filter on stubs for name/level (not available in stub),
  // so we actually need to fetch all when a deep filter is applied.
  // Here we use a lightweight strategy: render stubs, apply name search instantly;
  // for deeper filters we fetch all spells lazily in the background.

  let deepFetchPromise = null;
  let deepSpells = null; // full spell objects once loaded

  async function ensureDeepSpells() {
    if (deepSpells) return deepSpells;
    if (!deepFetchPromise) {
      deepFetchPromise = (async () => {
        const results = [];
        const total = allSpells.length;
        let done = 0;
        // fetch in parallel batches of 20
        for (let i = 0; i < allSpells.length; i += 20) {
          const batch = allSpells.slice(i, i + 20);
          const fetched = await Promise.all(batch.map(s => fetchSpell(s.index).catch(() => null)));
          fetched.forEach(s => { if (s) { spellCache[s.index] = s; results.push(s); } });
          done += batch.length;
          if (deepFetchInProgress) {
            document.getElementById('spell-count').textContent =
              `Loading ${done}/${total}…`;
          }
        }
        deepSpells = results;
        deepFetchInProgress = false;
        return results;
      })();
    }
    return deepFetchPromise;
  }

  let deepFetchInProgress = false;

  function needsDeepFetch() {
    return activeFilters.level !== '' || activeFilters.school !== '' ||
           activeFilters.cls !== '' || activeFilters.concentration || activeFilters.ritual;
  }

  // ── Render list ───────────────────────────────────────────────────────────

  async function renderList() {
    const listEl = document.getElementById('spell-list');

    if (!needsDeepFetch()) {
      // Fast path: just name search against stubs
      const filtered = getFilteredStubs();
      document.getElementById('spell-count').textContent =
        `${filtered.length} spell${filtered.length !== 1 ? 's' : ''}`;
      listEl.innerHTML = filtered.length === 0
        ? '<div style="padding:1rem;color:var(--muted);font-size:.85rem;text-align:center;">No spells found.</div>'
        : filtered.map(s => stubItem(s)).join('');
      bindListClicks();
      return;
    }

    // Deep filter path: need full data
    listEl.innerHTML = '<div class="loading"><div class="spinner"></div>Applying filters…</div>';
    deepFetchInProgress = true;
    const full = await ensureDeepSpells();

    const q = document.getElementById('search').value.toLowerCase();
    const filtered = full.filter(s => {
      if (q && !s.name.toLowerCase().includes(q)) return false;
      if (activeFilters.level !== '' && String(s.level) !== activeFilters.level) return false;
      if (activeFilters.school && s.school?.name?.toLowerCase() !== activeFilters.school.toLowerCase()) return false;
      if (activeFilters.cls && !s.classes?.some(c => c.name.toLowerCase() === activeFilters.cls.toLowerCase())) return false;
      if (activeFilters.concentration && !s.concentration) return false;
      if (activeFilters.ritual && !s.ritual) return false;
      return true;
    });

    document.getElementById('spell-count').textContent =
      `${filtered.length} spell${filtered.length !== 1 ? 's' : ''}`;
    listEl.innerHTML = filtered.length === 0
      ? '<div style="padding:1rem;color:var(--muted);font-size:.85rem;text-align:center;">No spells found.</div>'
      : filtered.map(s => richItem(s)).join('');
    bindListClicks();
  }

  function stubItem(s) {
    const active = s.index === activeIndex ? ' active' : '';
    return `<div class="spell-item${active}" data-index="${s.index}">
      <div class="spell-name">${s.name}</div>
    </div>`;
  }

  function richItem(s) {
    const active = s.index === activeIndex ? ' active' : '';
    const levelLabel = s.level === 0 ? 'Cantrip' : `Lvl ${s.level}`;
    const school = s.school?.name ?? '';
    const conc = s.concentration ? `<span class="badge badge-conc">C</span>` : '';
    const ritual = s.ritual ? `<span class="badge badge-ritual">R</span>` : '';
    return `<div class="spell-item${active}" data-index="${s.index}">
      <div class="spell-name">${s.name}</div>
      <div class="spell-meta">
        <span class="badge badge-level">${levelLabel}</span>
        <span class="badge badge-school">${school}</span>
        ${conc}${ritual}
      </div>
    </div>`;
  }

  function bindListClicks() {
    document.querySelectorAll('.spell-item').forEach(el => {
      el.addEventListener('click', () => selectSpell(el.dataset.index));
    });
  }

  // ── Detail ────────────────────────────────────────────────────────────────

  async function selectSpell(index) {
    activeIndex = index;
    document.querySelectorAll('.spell-item').forEach(el =>
      el.classList.toggle('active', el.dataset.index === index));

    const detail = document.getElementById('detail');
    detail.innerHTML = '<div class="loading"><div class="spinner"></div>Loading…</div>';

    try {
      const s = await fetchSpell(index);
      detail.innerHTML = renderDetail(s);
    } catch (e) {
      detail.innerHTML = `<div class="error-box">Failed to load spell: ${e.message}</div>`;
    }
  }

  function renderDetail(s) {
    const level = s.level === 0 ? 'Cantrip' : ordinal(s.level) + ' level';
    const school = s.school?.name ?? '—';
    const schoolColor = SCHOOL_COLORS[school] ?? 'var(--accent)';
    const components = (s.components ?? []).join(', ') + (s.material ? ` (${s.material})` : '');
    const dmgType = s.damage?.damage_type?.name ?? null;
    const dmgSlot = s.damage?.damage_at_slot_level ?? s.damage?.damage_at_character_level ?? null;
    const dmgEntry = dmgSlot ? Object.entries(dmgSlot).sort((a,b) => +a[0] - +b[0]) : null;

    const badges = [
      `<span class="badge badge-level">${level}</span>`,
      `<span class="badge badge-school" style="color:${schoolColor}">${school}</span>`,
      s.concentration ? `<span class="badge badge-conc">Concentration</span>` : '',
      s.ritual ? `<span class="badge badge-ritual">Ritual</span>` : '',
    ].filter(Boolean).join('');

    const stats = [
      { label: 'Casting Time', value: s.casting_time },
      { label: 'Range', value: s.range },
      { label: 'Duration', value: s.duration },
      { label: 'Components', value: components || '—' },
      dmgType ? { label: 'Damage Type', value: dmgType } : null,
      s.attack_type ? { label: 'Attack Type', value: capitalize(s.attack_type) } : null,
    ].filter(Boolean);

    const statsHtml = stats.map(st =>
      `<div class="detail-stat"><div class="label">${st.label}</div><div class="value">${st.value}</div></div>`
    ).join('');

    const descHtml = (s.desc ?? []).map(p => `<p>${p}</p>`).join('');

    const higherHtml = s.higher_level?.length
      ? `<div class="detail-section">
          <h3>At Higher Levels</h3>
          ${s.higher_level.map(p => `<p>${p}</p>`).join('')}
        </div>` : '';

    const dmgTableHtml = dmgEntry
      ? `<div class="detail-section">
          <h3>Damage by Slot</h3>
          <div style="display:flex;flex-wrap:wrap;gap:.4rem;">
            ${dmgEntry.map(([slot, dmg]) =>
              `<div class="detail-stat" style="min-width:80px">
                <div class="label">Slot ${slot}</div>
                <div class="value">${dmg}</div>
              </div>`).join('')}
          </div>
        </div>` : '';

    const classesHtml = s.classes?.length
      ? `<div class="detail-section">
          <h3>Available to</h3>
          <div class="classes-list">
            ${s.classes.map(c => `<span class="class-chip">${c.name}</span>`).join('')}
          </div>
        </div>` : '';

    return `
      <div class="detail-header">
        <h2>${s.name}</h2>
        <div class="badges">${badges}</div>
      </div>
      <div class="detail-grid">${statsHtml}</div>
      <div class="detail-section"><h3>Description</h3>${descHtml}</div>
      ${higherHtml}
      ${dmgTableHtml}
      ${classesHtml}
    `;
  }

  // ── Helpers ───────────────────────────────────────────────────────────────

  function ordinal(n) {
    return n + (['th','st','nd','rd'][(n > 3 && n < 21) || n % 10 > 3 ? 0 : n % 10] ?? 'th');
  }
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // ── Event wiring ──────────────────────────────────────────────────────────

  document.getElementById('search').addEventListener('input', () => renderList());

  document.getElementById('filter-level').addEventListener('change', e => {
    activeFilters.level = e.target.value;
    renderList();
  });
  document.getElementById('filter-school').addEventListener('change', e => {
    activeFilters.school = e.target.value;
    renderList();
  });
  document.getElementById('filter-class').addEventListener('change', e => {
    activeFilters.cls = e.target.value;
    renderList();
  });

  document.querySelectorAll('.chip[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.filter;
      activeFilters[key] = !activeFilters[key];
      btn.classList.toggle('active', activeFilters[key]);
      renderList();
    });
  });

  // ── Boot ──────────────────────────────────────────────────────────────────
  loadSpells();
</script>
</body>
</html>
